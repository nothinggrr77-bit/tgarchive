# Telegram Personal Archive — serverda doimiy ishlatish.
# Yo'riqnoma: docs/deploy.md
#
#   docker compose build
#   docker compose run --rm archiver login     # bir marta: telefon, kod, 2FA
#   docker compose up -d                       # ishga tushirish (server qayta yoqilganda ham)
#   docker compose logs -f archiver
#
# DIQQAT: "docker compose down -v" barcha volume'larni — butun arxivni va session'ni — o'chiradi.

name: tgarchive

x-paths: &paths
  DATA_DIR: /data
  DB_PATH: /data/db/archive.sqlite3
  MEDIA_DIR: /data/media
  EXPORT_DIR: /data/exports
  BACKUP_DIR: /data/backups
  LOG_FORMAT: json

x-hardening: &hardening
  read_only: true
  tmpfs:
    - /tmp:size=64m,mode=1777
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true
  init: true
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

services:
  archiver:
    <<: *hardening
    build: .
    image: tgarchive:local
    command: ["run"]
    restart: unless-stopped
    env_file: .env
    # Konteyner ichidagi yo'llar .env dagi qiymatlardan ustun turadi
    environment:
      <<: *paths
      # Archiver'ga bot tokeni kerak emas
      BOT_TOKEN: ""
    volumes:
      - db:/data/db
      - session:/data/session   # faqat archiver ulaydi; bot bu volume'ni olmaydi
      - media:/data/media
      - exports:/data/exports
      - backups:/data/backups
    # Tarmoqqa faqat chiquvchi ulanish kerak — hech qanday port ochilmaydi
    stop_grace_period: 30s
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "python", "-m", "tgarchive", "health", "--component", "archiver", "--max-age", "180"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 60s

  # Admin bot: ikkinchi akkaunt (OWNER_ID) orqali boshqaruv.
  # Asosiy akkaunt session'i va TG_API_HASH bu konteynerga BERILMAYDI.
  bot:
    <<: *hardening
    build: .
    image: tgarchive:local
    command: ["bot"]
    restart: unless-stopped
    env_file: .env
    environment:
      <<: *paths
      TG_API_ID: ""
      TG_API_HASH: ""
    volumes:
      - db:/data/db              # o'qish + audit va "yuklab olish" so'rovlari
      - media:/data/media:ro     # fayllarni faqat o'qiydi
      - exports:/data/exports
    depends_on:
      - archiver                 # bazani archiver migratsiya qiladi; bot sxemani kutadi
    stop_grace_period: 15s
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "python", "-m", "tgarchive", "health", "--component", "bot", "--max-age", "180"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 60s

volumes:
  db:
  session:
  media:
  exports:
  backups:
