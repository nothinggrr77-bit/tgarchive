# Faqat dasturchi uchun: yangi migratsiya yaratish
#   alembic revision --autogenerate -m "izoh"
# Ilova o'zi migratsiyalarni `tgarchive db-upgrade` orqali qo'llaydi
# (tgarchive/db/migrate.py), bu fayl unga kerak emas.
# Baza manzili .env dagi DATA_DIR / DB_PATH dan olinadi.

[alembic]
script_location = tgarchive:migrations
prepend_sys_path = src
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
truncate_slug_length = 40

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
